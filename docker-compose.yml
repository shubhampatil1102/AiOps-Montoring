version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: aiops-db
    restart: always
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  backend:
    build: ./backend
    container_name: aiops-backend
    restart: always
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres
      DB_USER: aiops
      DB_PASSWORD: aiops123
      DB_NAME: aiops


  frontend:
    build: ./frontend
    container_name: aiops-ui
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"


volumes:
  pgdata: